services:
  react:
    container_name: dimes
    hostname: crguerrero
    image: node:alpine
    init: true
    working_dir: /root/react
    environment:
      - VITE_PORT=80
      - VITE_HOST=0.0.0.0
      - CI=true
    volumes:
      - $PWD/:/root/react
      - $PWD/../.pnpm/:/root/.pnpm
    networks:
      - net
    ports:
      - '80:80'
    command: sh -c "apk add --no-cache libc6-compat && npm install -g pnpm && pnpm config set store-dir /root/.pnpm && pnpm install && pnpm dev"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:80', r => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks:
  net:
